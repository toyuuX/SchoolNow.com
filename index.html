<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SchoolNow – Students helping students</title>
<style>
:root{--bg:#f4f1ff;--fg:#1d1b2e;--mut:#6b6785;--card:rgba(255,255,255,.62);--bd:rgba(255,255,255,.8);--pri:#6c4cff;--pri2:#ff5fa2;--free:#16a34a;--adv:#d97706;--chip:rgba(108,76,255,.1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12101f;--fg:#efecff;--mut:#a29fc0;--card:rgba(40,36,66,.6);--bd:rgba(255,255,255,.1);--chip:rgba(150,130,255,.16);--free:#4ade80;--adv:#fbbf24}}
:root[data-theme="dark"]{--bg:#12101f;--fg:#efecff;--mut:#a29fc0;--card:rgba(40,36,66,.6);--bd:rgba(255,255,255,.1);--chip:rgba(150,130,255,.16);--free:#4ade80;--adv:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;animation:fl 14s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:var(--pri);top:-80px;left:-80px}
.b2{width:300px;height:300px;background:var(--pri2);bottom:-60px;right:-60px;animation-delay:-6s}
@keyframes fl{to{transform:translate(60px,40px) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:14px 16px 90px}
.glass{background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;box-shadow:0 8px 30px rgba(60,40,140,.12)}
header{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;padding:12px 14px;margin-bottom:14px}
.logo{font-weight:800;font-size:21px;letter-spacing:-.5px;flex:1;min-width:0;white-space:nowrap}
.logo span{background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.wal{display:flex;align-items:center;border-radius:99px;background:var(--chip);font-weight:700;font-size:14px;cursor:pointer;overflow:hidden;flex-shrink:0}.wal div{display:flex;align-items:center;gap:5px;padding:9px 12px;transition:transform .25s}.wal div+div{border-left:1px solid var(--bd)}
.wal .pop{transform:scale(1.2)}
.wal .f b{color:var(--free)}.wal .a b{color:var(--adv)}
nav{display:flex;gap:6px;padding:6px;margin-bottom:16px;overflow-x:auto}
nav button{flex:1;white-space:nowrap;border:0;background:none;color:var(--mut);font-weight:600;font-size:13px;font-family:inherit;padding:10px 6px;border-radius:18px;cursor:pointer;transition:.25s}
nav button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(108,76,255,.35)}
h2{margin:6px 4px 12px;font-size:20px}
.hero{padding:22px;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:26px;letter-spacing:-.5px}
.hero p{margin:0;color:var(--mut)}
input,select,textarea{width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--chip);color:var(--fg);font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{border:0;background:var(--chip);color:var(--fg);padding:8px 14px;border-radius:99px;font:600 13px inherit;font-family:inherit;white-space:nowrap;cursor:pointer;transition:.2s}
.chip.on{background:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{padding:16px;display:flex;flex-direction:column;gap:8px;animation:in .4s both;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.top{display:flex;gap:10px;align-items:center}
.av{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:var(--chip)}
.nm{font-weight:700}.sub{font-size:12px;color:var(--mut)}
.stars{color:#f5a623;letter-spacing:1px;font-size:14px}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--chip);font-weight:600}
.tag.rec{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.price{font-weight:800;color:var(--free)}
.btn{border:0;cursor:pointer;font:700 14px inherit;font-family:inherit;padding:10px 16px;border-radius:16px;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));transition:.2s}
.btn:active{transform:scale(.95)}
.btn.alt{background:var(--chip);color:var(--fg)}
.btn.adv{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.panel{padding:18px;margin-bottom:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
label{font-size:12px;font-weight:700;color:var(--mut);display:block;margin:10px 0 4px}
.big{font-size:32px;font-weight:800}
.bar{height:10px;border-radius:9px;background:var(--chip);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width 3s linear}
.rate{display:flex;gap:4px;justify-content:center;margin:12px 0}
.rate span{font-size:34px;cursor:pointer;color:var(--mut);transition:.15s}
.rate span.on{color:#f5a623;transform:scale(1.1)}
.modal{position:fixed;inset:0;background:rgba(10,8,30,.5);display:none;place-items:center;z-index:9;padding:20px}
.modal.show{display:grid}
.modal .glass{max-width:340px;width:100%;padding:22px;background:var(--bg);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);padding:12px 20px;border-radius:99px;background:var(--fg);color:var(--bg);font-weight:600;z-index:10;transition:.35s;max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mut);padding:30px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:20px}
.av{overflow:hidden;flex-shrink:0}.av img{width:100%;height:100%;object-fit:cover}.av.lg{width:96px;height:96px;font-size:52px;border-radius:30px;margin:0 auto 10px}
nav{display:grid;grid-template-columns:repeat(3,1fr)}
.still{animation:none}
.more{border-top:1px dashed var(--bd);padding-top:10px;font-size:14px;display:flex;flex-direction:column;gap:8px;animation:in .3s both}
.rv{background:var(--chip);border-radius:14px;padding:8px 10px;font-size:13px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px}
.b{max-width:78%;padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.35;animation:in .25s both}
.b.in{background:var(--chip);align-self:flex-start;border-bottom-left-radius:6px}
.b.out{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.ems{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
<header class="glass">
  <div class="logo">🎓 School<span>Now</span></div>
  <div class="wal" id="wal" title="Open wallet"><div class="f" id="cf">🪙 <b id="vf">0</b></div>
  <div class="a" id="ca">💎 <b id="va">0</b></div></div>
</header>
<nav class="glass" id="nav">
  <button data-t="discover" class="on">🔎 Discover</button>
  <button data-t="offer">✍️ Offer</button>
  <button data-t="sessions">📚 Sessions</button>
  <button data-t="chat">💬 Chat</button>
  <button data-t="wallet">👛 Wallet</button>
  <button data-t="profile">👤 Profile</button>
</nav>
<main id="main"></main>
<div class="foot">SchoolNow is a demo – no real payments or accounts. Students helping students ✨</div>
</div>

<div class="modal" id="modal"><div class="glass">
  <h3 style="margin:0 0 4px">How was the session?</h3>
  <div class="sub" id="mtxt"></div>
  <div class="rate" id="rate"></div>
  <button class="btn" id="send">Submit rating</button>
</div></div>
<div class="toast" id="toast"></div>

}
function wallet(){
  var cash=(S.adv*0.1).toFixed(2);
  return '<h2>Wallet</h2><div class="two">'
  +'<div class="glass panel"><div class="sub">Free Coins 🪙</div><div class="big" style="color:var(--free)">'+S.free+'</div><p class="sub">Used to book tutoring. Earn them by watching daily ads or offering free help.</p>'
  +'<div class="bar"><i id="bar"></i></div><button class="btn" id="ad">▶ Watch ad (+2) · '+S.ads+'/3 today</button></div>'
  +'<div class="glass panel"><div class="sub">Advanced Coins 💎</div><div class="big" style="color:var(--adv)">'+S.adv+'</div><p class="sub">Earned by spending money or when students pay you. Worth ≈ €'+cash+'</p>'
  +'<label>Convert to Free Coins (1 💎 = 1 🪙)</label><div style="display:flex;gap:8px"><input id="cv" type="number" min="1" value="10" style="width:90px"><button class="btn alt" id="conv">Convert</button></div><br><button class="btn adv" id="cash">Cash out to bank 🏦</button></div>'
  +'<div class="glass panel"><h3 style="margin-top:0">🛒 Top up with real money</h3><p class="sub">Spend money and get Advanced Coins as a bonus!</p><button class="btn" data-m="5">€5 → 20 🪙 + 5 💎</button> <button class="btn" data-m="10">€10 → 45 🪙 + 12 💎</button></div>'+extra()+'</div>';
}
function addLog(t,v){S.hist.unshift({t:t,v:v});S.hist=S.hist.slice(0,8)}
var LV=['Newbie','Helper','Mentor','Pro Tutor','Legend'];
function extra(){var lv=Math.min(4,Math.floor(S.xp/30)),p=lv===4?100:(S.xp%30)/30*100;
  return '<div class="glass panel"><div class="sub">🏅 Helper level</div><div class="big">'+LV[lv]+'</div><div class="bar"><i style="width:'+p+'%;transition:none"></i></div><p class="sub">'+S.xp+' XP · help others & finish sessions to level up</p><p style="margin:0 0 10px">🔥 <b>'+S.streak+'-day streak</b></p><button class="btn" id="daily"'+(S.claimed?' disabled':'')+'>'+(S.claimed?'Come back tomorrow':'🎁 Claim +'+(1+Math.min(S.streak,3))+' 🪙')+'</button></div>'
  +'<div class="glass panel"><h3 style="margin-top:0">🧾 Recent activity</h3>'+(S.hist.length?S.hist.map(function(h){return '<div class="row" style="margin:8px 0"><span class="sub" style="font-size:13px">'+esc(h.t)+'</span><b>'+h.v+'</b></div>'}).join(''):'<div class="sub">Nothing yet – your coin activity shows up here.</div>')+'</div>'}
function navbar(){var un=S.chats.reduce(function(a,c){return a+c.un},0);
  [].forEach.call($('nav').children,function(b){b.classList.toggle('on',b.dataset.t===S.tab);if(b.dataset.t==='chat')b.textContent='💬 Chat'+(un?' ('+un+')':'')})}
function render(){
  var tb=S.tab,f=tb==='discover'?discover:tb==='offer'?offer:tb==='sessions'?sessions:tb==='chat'?chatView:tb==='profile'?profile:wallet;
  $('main').innerHTML=f();navbar();upd();
  var sc=$('msgs');if(sc)sc.scrollTop=sc.scrollHeight;
}
$('nav').onclick=function(e){var t=e.target.dataset.t;if(t){S.tab=t;render()}};
$('wal').onclick=function(){S.tab='wallet';render()};
$('main').addEventListener('change',function(e){
  if(e.target.id==='srt'){S.sort=e.target.value;render()}
  else if(e.target.id==='pf'&&e.target.files[0]){grab();var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=c.height=128;var x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);S.me.img=c.toDataURL('image/jpeg',.85);render();toast('Photo updated 📸')};im.src=fr.result};fr.readAsDataURL(e.target.files[0])}
});
$('main').addEventListener('click',function(e){var el=e.target.closest('[data-cid]');if(el){S.cur=el.dataset.cid;getChat(S.cur).un=0;render()}});
$('main').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='ci')sendMsg()});
$('main').addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;var p=e.target.selectionStart;render();var q=$('q');q.focus();q.setSelectionRange(p,p)}});
$('main').addEventListener('click',function(e){
  var d=e.target.dataset,id=e.target.id;
  if(d.c){S.cat=d.c;render()}
  else if(d.b){var t=T.filter(function(x){return x.id==d.b})[0];
    if(S.free<t.p){toast('Not enough Free Coins – watch an ad or top up! 🪙');return}
    S.free-=t.p;S.sessions.unshift({n:t.n,e:t.e,t:t.t,id:t.id,done:0,rated:0});addLog('Booked '+t.t,t.p?'−'+t.p+' 🪙':'free');if(!t.mine)ensure(t,'Thanks for booking “'+t.t+'”! When suits you?');pop('cf');toast(t.p?'Booked! −'+t.p+' Free Coins':'Booked – free help on its way 💜')}
  else if(d.f){S.sessions[d.f].done=1;S.xp+=10;addLog('Finished a session','+10 XP');render();toast('Session complete – please rate it!')}
  else if(d.r){S.rateFor=+d.r;S.rating=0;var s=S.sessions[S.rateFor];$('mtxt').textContent=s.t+' with '+s.n;drawRate();$('modal').classList.add('show')}
  else if(id==='post'){var ti=$('ot').value.trim(),p=Math.max(0,+$('op').value||0);if(!ti){toast('Add a title first ✏️');return}
    T.unshift({id:S.nid++,mine:1,c:$('oc').value,t:ti,d:$('od').value.trim(),w:'Flexible times',p:p,r:4.0,k:0});toast('Offer published! Find it in Discover 🎉')}
  else if(id==='sim'){var mine=T.filter(function(x){return x.mine})[0];if(!mine){toast('Publish an offer first ✍️');return}
    S.xp+=15;if(mine.p){S.adv+=mine.p;addLog('A student paid you','+'+mine.p+' 💎');pop('ca');toast('A student paid '+mine.p+' 🪙 → you earned '+mine.p+' 💎')}else{S.free+=2;addLog('Gave free help','+2 🪙');pop('cf');toast('Free help given → +2 Free Coins 🪙')}}
  else if(id==='ad'){if(S.ads>=3){toast('Daily ad limit reached – come back tomorrow');return}
    var b=$('bar');b.style.width='100%';e.target.disabled=true;e.target.textContent='Playing ad…';
    setTimeout(function(){S.ads++;S.free+=2;addLog('Watched an ad','+2 🪙');toast('+2 Free Coins 🪙');render();pop('cf')},3000)}
  else if(id==='conv'){var n=Math.floor(+$('cv').value||0);if(n<1||n>S.adv){toast('Enter an amount up to your '+S.adv+' 💎');return}S.adv-=n;S.free+=n;addLog('Converted '+n+' 💎','+'+n+' 🪙');render();pop('cf');toast('Converted '+n+' 💎 → '+n+' 🪙')}
  else if(id==='daily'){var g=1+Math.min(S.streak,3);S.free+=g;S.streak++;S.claimed=1;addLog('Daily streak bonus','+'+g+' 🪙');render();pop('cf');toast('🔥 Streak bonus +'+g+' 🪙')}
  else if(id==='cash'){if(S.adv<20){toast('Minimum cash-out is 20 💎 (≈ €2.00)');return}toast('€'+(S.adv*0.1).toFixed(2)+' sent to your bank 🏦 (demo)');addLog('Cash out to bank','−'+S.adv+' 💎');S.adv=0;render()}
  else if(d.m){addLog('Top-up €'+d.m,d.m==='5'?'+20 🪙 +5 💎':'+45 🪙 +12 💎');if(d.m==='5'){S.free+=20;S.adv+=5}else{S.free+=45;S.adv+=12}render();pop('cf');pop('ca');toast('Thanks! Coins added (demo payment)')}
  else if(d.o){S.open=S.open==d.o?null:+d.o;S.still=1;render();S.still=0}
  else if(d.chat){openChat(+d.chat)}
  else if(id==='back'){S.cur=null;render()}
  else if(id==='csend'){sendMsg()}
  else if(d.emo){grab();S.me.e=d.emo;S.me.img='';render()}
  else if(id==='prm'){grab();S.me.img='';render()}
  else if(id==='psave'){grab();toast('Profile saved ✅');render()}
  else return;
  if(['post','sim','ad','conv','cash','b','f','r','m'].indexOf(id||Object.keys(d)[0])>-1&&id!=='ad'&&!d.r)render();
});
function drawRate(){$('rate').innerHTML=[1,2,3,4,5].map(function(i){return '<span data-s="'+i+'" class="'+(i<=S.rating?'on':'')+'">★</span>'}).join('')}
$('rate').onclick=function(e){if(e.target.dataset.s){S.rating=+e.target.dataset.s;drawRate()}};
$('send').onclick=function(){
  if(!S.rating){toast('Tap a star first ⭐');return}
  var s=S.sessions[S.rateFor],t=T.filter(function(x){return x.id===s.id})[0];
  if(t){t.r=(t.r*t.k+S.rating)/(t.k+1);t.k++}
  s.rated=S.rating;S.xp+=5;addLog('Rated a session','+5 XP');$('modal').classList.remove('show');render();
  toast('Thanks! '+(S.rating>=4?'This helper will be recommended more 🌟':'Feedback sent'));
};
$('modal').onclick=function(e){if(e.target===this)this.classList.remove('show')};
render();
</script>
</body>
</html>
